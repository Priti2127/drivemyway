version: '3.9'

services:
  # ─── Databases ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dmw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: drivemyway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dmw_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend Services ───────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./backend/services/auth
      dockerfile: Dockerfile
    container_name: dmw_auth
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres_dev_password@postgres:5432/drivemyway
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  booking-service:
    build:
      context: ./backend/services/booking
      dockerfile: Dockerfile
    container_name: dmw_booking
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres_dev_password@postgres:5432/drivemyway
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  tracking-service:
    build:
      context: ./backend/services/tracking
      dockerfile: Dockerfile
    container_name: dmw_tracking
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres_dev_password@postgres:5432/drivemyway
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-prod
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
      FAMILY_TRACKER_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
